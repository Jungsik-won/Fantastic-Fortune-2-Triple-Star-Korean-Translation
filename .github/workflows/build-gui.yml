name: Build and verify desktop GUI
on:
  push:
    branches: [main]
    paths: ['gui/**', 'tests/**', '.github/workflows/build-gui.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            label: windows-x64
          - runner: macos-14
            label: macos-apple-silicon
          - runner: macos-15-intel
            label: macos-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install builder
        run: python -m pip install pyinstaller==6.22.3
      - name: Test patch safety and large-file support
        run: python -m unittest discover -s tests -v
      - name: Build and test bundled GUI
        run: python gui/build_desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: gui-${{ matrix.label }}
          path: release-assets/*.zip
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish verified apps to existing v0.9 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v0.9 release-assets/*.zip --repo "$GITHUB_REPOSITORY" --clobber
